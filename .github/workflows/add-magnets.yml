name: Add magnets to Real-Debrid

# Bulk-add magnets to your Real-Debrid account.
# 1. Add a repository secret RD_TOKEN — your private API token from
#    https://real-debrid.com/apitoken
# 2. Put one magnet link per line in magnets.txt (blank lines and lines
#    starting with # are ignored), commit, and push — or run this workflow
#    manually from the Actions tab.
# Each magnet is added and its files selected for download. magnets.txt is
# only read here; you can empty it again afterwards (Real-Debrid keeps the
# torrents).
on:
  push:
    branches: ['**']
    paths: ['magnets.txt', '.github/workflows/add-magnets.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  add:
    name: Add magnets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add each magnet to Real-Debrid
        env:
          RD_TOKEN: ${{ secrets.RD_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${RD_TOKEN:-}" ]; then
            echo "::error::RD_TOKEN secret is not set. Add it in Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ ! -f magnets.txt ]; then
            echo "::error::magnets.txt not found."
            exit 1
          fi

          api="https://api.real-debrid.com/rest/1.0"
          auth="Authorization: Bearer ${RD_TOKEN}"
          added=0; failed=0

          # addMagnet with retry/backoff on rate limiting (error_code 34).
          # Echoes the torrent id on success, nothing on failure.
          add_magnet() {
            local magnet="$1" attempt resp id
            for attempt in 1 2 3 4 5; do
              resp="$(curl -sS -X POST "$api/torrents/addMagnet" \
                -H "$auth" --data-urlencode "magnet=$magnet" || true)"
              # RD returns {"id": "...", "uri": "..."} on success (note the space).
              id="$(printf '%s' "$resp" | grep -oE '"id"[[:space:]]*:[[:space:]]*"[^"]+"' \
                | head -1 | sed -E 's/.*"([^"]+)"$/\1/')"
              if [ -n "$id" ]; then printf '%s' "$id"; return 0; fi
              case "$resp" in
                *too_many_requests*|*error_code\":\ 34*)
                  sleep $((attempt * 3)); continue ;;
                *) echo "::warning::addMagnet failed: $resp" >&2; return 1 ;;
              esac
            done
            echo "::warning::addMagnet gave up after retries" >&2
            return 1
          }

          # Read line-by-line; ignore blanks and comments.
          while IFS= read -r line || [ -n "$line" ]; do
            magnet="$(printf '%s' "$line" | sed 's/[[:space:]]*$//')"
            case "$magnet" in
              ''|\#*) continue ;;
              magnet:*) ;;
              *) echo "Skipping non-magnet line: ${magnet:0:40}…"; continue ;;
            esac

            name="$(printf '%s' "$magnet" | sed -n 's/.*[?&]dn=\([^&]*\).*/\1/p' | head -c 80)"
            echo "----"
            echo "Adding: ${name:-<unnamed>}"

            id="$(add_magnet "$magnet")" || { failed=$((failed+1)); continue; }

            # Select all files so Real-Debrid starts caching them.
            sel="$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
              "$api/torrents/selectFiles/$id" -H "$auth" --data "files=all" || true)"
            echo "Added id=$id (selectFiles HTTP $sel)"
            added=$((added+1))

            sleep 3  # be gentle with the API
          done < magnets.txt

          echo "===="
          echo "Done: $added added, $failed failed."

          echo ""
          echo "Whose account is this token? (GET /user):"
          curl -sS "$api/user" -H "$auth" \
            | grep -oE '"(username|email|type|premium)":[^,}]*' || true

          echo ""
          echo "Torrent count (GET /torrents):"
          tcount="$(curl -sS "$api/torrents?limit=100" -H "$auth")"
          echo "raw (first 1500 chars): ${tcount:0:1500}"

          if [ "$added" -eq 0 ]; then exit 1; fi
